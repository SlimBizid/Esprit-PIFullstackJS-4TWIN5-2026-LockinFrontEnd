apiVersion: apps/v1
kind: Deployment
metadata:
  name: bytebattle-frontend
  namespace: bytebattle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bytebattle-frontend
  template:
    metadata:
      labels:
        app: bytebattle-frontend
    spec:
      containers:
        - name: frontend
          image: slimbizid/bytebattle-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bytebattle-frontend
  namespace: bytebattle
spec:
  selector:
    app: bytebattle-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
